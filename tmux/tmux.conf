# Tmux configuration

# Use Ctrl-a as prefix instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Mouse support: scrolling the wheel/touchpad in a normal pane drops into
# copy-mode and scrolls the scrollback; in full-screen apps (nvim, less) the
# wheel passes through to the app.
#
# Caveat: enabling mouse hands tmux ALL mouse events, so a plain click-drag
# becomes a tmux selection. There's no way to auto-route the wheel to tmux but
# leave drags to the terminal — once tmux owns the mouse the terminal can't
# tell the gestures apart. To select with the terminal's own native selection
# (and keep Cmd-C / Cmd-V working as before), hold Shift while dragging:
# Ghostty then does the selection instead of tmux. Shift is the decoupler.
set -g mouse on
setw -g mode-keys vi

# Wheel scrolls one line per tick — tmux's default binding jumps five (-N 5).
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down

# Color support: announce 256 colors to inner programs, but tell tmux that the
# outer terminal handles 24-bit RGB so it forwards truecolor through. Without
# the override, nvim colorschemes fall back to the 256-color cube and look
# washed out.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc,alacritty:Tc"

# Use Fish shell — prefer homebrew on macOS, else first fish in PATH.
# Falls back to $SHELL silently if no fish is found.
run-shell 'if [ -x /opt/homebrew/bin/fish ]; then tmux set -g default-shell /opt/homebrew/bin/fish; elif command -v fish >/dev/null 2>&1; then tmux set -g default-shell "$(command -v fish)"; fi'

# Faster command sequences (no delay)
set -s escape-time 0

# Forward terminal focus events to programs inside tmux
set -g focus-events on

# --- Status bar: gruvbox-dark, rounded-pill segments ---
# Each segment is a "pill": a left half-circle cap (), the coloured body, and
# a right half-circle cap (), with the cap glyph drawn in the pill's colour
# over the bar background so the edge reads as rounded. Requires a Nerd Font
# (the same font the powerline glyphs elsewhere need). Palette is gruvbox dark:
# bg0 #282828, bg1 #3c3836, bg2 #504945, bg3 #665c54, fg #ebdbb2, dim #a89984,
# yellow #d79921 (session), aqua #8ec07c (active window).
set -g status-position top

# Make the status area two rows tall and leave the second row blank: a one-row
# gap between the (top-positioned) bar and the pane content so it isn't
# crowded. status-format[0] keeps tmux's default bar; [1] is the empty spacer,
# styled bg=default so it reads as a true gap rather than a dark band.
set -g status 2
set -g status-format[1] '#[bg=default]'

set -g status-style 'bg=#282828,fg=#a89984'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g window-status-separator ' '

# Refresh status-right (clock + the CPU/RAM #() probes) every 5s, not 15.
set -g status-interval 5

# Left: session pill (yellow)
set -g status-left '#[fg=#d79921,bg=#282828]#[bg=#d79921,fg=#282828,bold] #S #[fg=#d79921,bg=#282828,nobold]'

# Windows: inactive pill (bg1 grey), current pill (aqua)
setw -g window-status-format '#[fg=#3c3836,bg=#282828,nobold]#[bg=#3c3836,fg=#a89984] #I #W #[fg=#3c3836,bg=#282828]'
setw -g window-status-current-format '#[fg=#8ec07c,bg=#282828]#[bg=#8ec07c,fg=#282828,bold] #I #W #[fg=#8ec07c,bg=#282828,nobold]'

# Right: CPU + RAM progress-bar pills + date pill (bg2) + time pill (bg3).
# The CPU/RAM pills are emitted whole — caps, split fill, tier colour — by
# tmux/system-stats.sh (tmux re-parses #() output for #[...] styles); they
# fill green/amber/red by load, like the Claude context bar. Refreshed on
# status-interval.
set -g status-right '#(~/.config/tmux/system-stats.sh cpu)  #(~/.config/tmux/system-stats.sh mem)  #[fg=#504945,bg=#282828]#[bg=#504945,fg=#ebdbb2] %Y-%m-%d #[fg=#504945,bg=#282828]  #[fg=#665c54,bg=#282828]#[bg=#665c54,fg=#ebdbb2] %H:%M #[fg=#665c54,bg=#282828] '

# Pane chrome + messages share the palette
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#8ec07c'
set -g message-style 'bg=#d79921,fg=#282828'
set -g message-command-style 'bg=#d79921,fg=#282828'
set -g mode-style 'bg=#d79921,fg=#282828'

# More intuitive split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
