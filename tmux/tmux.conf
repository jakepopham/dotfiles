# Tmux configuration

# Use Ctrl-a as prefix instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Color support: announce 256 colors to inner programs, but tell tmux that the
# outer terminal handles 24-bit RGB so it forwards truecolor through. Without
# the override, nvim colorschemes fall back to the 256-color cube and look
# washed out.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc,alacritty:Tc"

# Use Fish shell — prefer homebrew on macOS, else first fish in PATH.
# Falls back to $SHELL silently if no fish is found.
run-shell 'if [ -x /opt/homebrew/bin/fish ]; then tmux set -g default-shell /opt/homebrew/bin/fish; elif command -v fish >/dev/null 2>&1; then tmux set -g default-shell "$(command -v fish)"; fi'

# Faster command sequences (no delay)
set -s escape-time 0

# Forward terminal focus events to programs inside tmux
set -g focus-events on

# --- Status bar: gruvbox-dark, rounded-pill segments ---
# Each segment is a "pill": a left half-circle cap (), the coloured body, and
# a right half-circle cap (), with the cap glyph drawn in the pill's colour
# over the bar background so the edge reads as rounded. Requires a Nerd Font
# (the same font the powerline glyphs elsewhere need). Palette is gruvbox dark:
# bg0 #282828, bg1 #3c3836, bg2 #504945, bg3 #665c54, fg #ebdbb2, dim #a89984,
# yellow #d79921 (session), aqua #8ec07c (active window).
set -g status-style 'bg=#282828,fg=#a89984'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ' '

# Left: session pill (yellow)
set -g status-left '#[fg=#d79921,bg=#282828]#[bg=#d79921,fg=#282828,bold] #S #[fg=#d79921,bg=#282828,nobold]'

# Windows: inactive pill (bg1 grey), current pill (aqua)
setw -g window-status-format '#[fg=#3c3836,bg=#282828,nobold]#[bg=#3c3836,fg=#a89984] #I #W #[fg=#3c3836,bg=#282828]'
setw -g window-status-current-format '#[fg=#8ec07c,bg=#282828]#[bg=#8ec07c,fg=#282828,bold] #I #W #[fg=#8ec07c,bg=#282828,nobold]'

# Right: date pill (bg2) + time pill (bg3)
set -g status-right '#[fg=#504945,bg=#282828]#[bg=#504945,fg=#ebdbb2] %Y-%m-%d #[fg=#504945,bg=#282828]  #[fg=#665c54,bg=#282828]#[bg=#665c54,fg=#ebdbb2] %H:%M #[fg=#665c54,bg=#282828] '

# Pane chrome + messages share the palette
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#8ec07c'
set -g message-style 'bg=#d79921,fg=#282828'
set -g message-command-style 'bg=#d79921,fg=#282828'
set -g mode-style 'bg=#d79921,fg=#282828'

# More intuitive split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
